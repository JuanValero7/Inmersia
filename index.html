<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sin esto, `env(safe-area-inset-*)` vale 0 en iPhone
         y las 17 reglas que lo usan (6 hojas móviles) no hacen nada. Con esto la
         página va a sangre bajo el notch y esas reglas empiezan a trabajar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Inmersia — Lee, investiga y colecciona</title>
    <link rel="canonical" href="https://www.inmersia.io/" />
    <meta name="description" content="Inmersia convierte cada libro en un mundo para habitar: imágenes, sonido, pistas para investigar la trama y una comunidad que lee contigo." />
    <meta name="theme-color" content="#f5efe2" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inmersia" />
    <meta property="og:title" content="Inmersia — Lee, investiga y colecciona" />
    <meta property="og:description" content="Inmersia convierte cada libro en un mundo para habitar: imágenes, sonido, pistas para investigar la trama y una comunidad que lee contigo." />
    <meta property="og:url" content="https://www.inmersia.io/" />
    <meta property="og:image" content="https://www.inmersia.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_ES" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Inmersia — Lee, investiga y colecciona" />
    <meta name="twitter:description" content="Inmersia convierte cada libro en un mundo para habitar: imágenes, sonido, pistas para investigar la trama y una comunidad que lee contigo." />
    <meta name="twitter:image" content="https://www.inmersia.io/og-image.png" />
  </head>
  <body>
    <!-- Bloque estático para los rastreadores. Lo rellena scripts/generar-seo.mjs
         durante el build, con contenido distinto por libro (título, sinopsis,
         índice y capítulo 1). Existe porque el <body> de un SPA llega vacío por
         el cable: Google indexa el HTML crudo en una primera pasada y solo
         después, en una cola aparte, ejecuta el JavaScript. Bing, WhatsApp,
         Telegram y los rastreadores de IA no ejecutan nada en absoluto.
         src/main.jsx lo retira antes de montar React, así que el usuario solo
         lo ve en la misma ventana en la que hoy ve una pantalla en blanco.
         En `npm run dev` queda vacío y no hace nada. -->
    <div id="seo-estatico"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
