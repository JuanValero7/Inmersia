<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Mapa">
  <defs>
    <clipPath id="mapClip"><rect x="0" y="0" width="400" height="300" rx="6"/></clipPath>
  </defs>
  <g clip-path="url(#mapClip)">
    <!-- paper base -->
    <rect x="0" y="0" width="400" height="300" fill="#efe6d0"/>

    <!-- subtle block fills -->
    <g fill="#e7dcc0" opacity="0.7">
      <rect x="14" y="14" width="72" height="52"/>
      <rect x="98" y="14" width="86" height="52"/>
      <rect x="196" y="14" width="78" height="52"/>
      <rect x="14" y="80" width="72" height="70"/>
      <rect x="98" y="80" width="86" height="70"/>
      <rect x="14" y="164" width="72" height="64"/>
      <rect x="98" y="164" width="86" height="64"/>
      <rect x="14" y="242" width="72" height="48"/>
      <rect x="98" y="242" width="86" height="48"/>
    </g>

    <!-- park -->
    <rect x="206" y="150" width="120" height="94" rx="8" fill="#c6d8a4"/>
    <circle cx="240" cy="180" r="9" fill="#aec98a"/>
    <circle cx="292" cy="205" r="12" fill="#aec98a"/>
    <circle cx="266" cy="222" r="7" fill="#aec98a"/>

    <!-- water (river running to a corner) -->
    <path d="M300 -10 C 330 60, 360 90, 420 120 L 440 -20 Z" fill="#a9c7cf"/>
    <path d="M-20 250 C 60 240, 120 275, 200 268 C 280 262, 340 300, 420 288 L 420 340 L -20 340 Z" fill="#a9c7cf"/>

    <!-- streets: thin outline under, cream road on top -->
    <g stroke="#d8cba9" stroke-width="9" fill="none" stroke-linecap="round">
      <line x1="0" y1="72" x2="400" y2="72"/>
      <line x1="0" y1="156" x2="400" y2="156"/>
      <line x1="0" y1="234" x2="400" y2="234"/>
      <line x1="90" y1="0" x2="90" y2="300"/>
      <line x1="190" y1="0" x2="190" y2="300"/>
      <line x1="332" y1="0" x2="332" y2="300"/>
    </g>
    <g stroke="#fbf6ea" stroke-width="6" fill="none" stroke-linecap="round">
      <line x1="0" y1="72" x2="400" y2="72"/>
      <line x1="0" y1="156" x2="400" y2="156"/>
      <line x1="0" y1="234" x2="400" y2="234"/>
      <line x1="90" y1="0" x2="90" y2="300"/>
      <line x1="190" y1="0" x2="190" y2="300"/>
      <line x1="332" y1="0" x2="332" y2="300"/>
    </g>

    <!-- minor streets -->
    <g stroke="#f3ecda" stroke-width="3" fill="none">
      <line x1="0" y1="116" x2="400" y2="116"/>
      <line x1="0" y1="196" x2="400" y2="196"/>
      <line x1="45" y1="0" x2="45" y2="300"/>
      <line x1="140" y1="0" x2="140" y2="300"/>
      <line x1="260" y1="0" x2="260" y2="300"/>
    </g>

    <!-- curved avenue (natural sweep, no harsh diagonal) -->
    <path d="M-24 286 C 96 236, 176 158, 300 118 C 356 100, 400 90, 430 82" fill="none" stroke="#d8cba9" stroke-width="11" stroke-linecap="round"/>
    <path d="M-24 286 C 96 236, 176 158, 300 118 C 356 100, 400 90, 430 82" fill="none" stroke="#fbf6ea" stroke-width="7" stroke-linecap="round"/>

    <!-- vignette -->
    <rect x="0" y="0" width="400" height="300" rx="6" fill="none" stroke="rgba(120,96,60,0.18)" stroke-width="2"/>
  </g>
</svg>
